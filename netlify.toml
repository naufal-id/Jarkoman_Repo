[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Aset hasil build punya hash di nama file, jadi aman di-cache selamanya.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Script hanya dari situs sendiri, plus satu script inline di index.html (ambil jadwal lebih awal) lewat hash-nya.
    # Hash dicek test (tests/csp.test.ts) supaya tidak basi saat index.html diubah. Gambar dan audio boleh dari
    # https mana saja karena admin bisa memasang gambar latar dan lagu dari link.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-yMGbyFFbov6djIfJ4ewX77O4yix7elsSqbuPsO+p/hY='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'"

# Dashboard admin tidak perlu muncul di mesin pencari dan tidak boleh di-embed situs lain.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
